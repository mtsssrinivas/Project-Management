services:
  - type: web
    name: projectflow-api
    runtime: node
    rootDir: server
    buildCommand: npm install && npx prisma generate
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: CLIENT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: DATABASE_URL
        fromDatabase:
          name: projectflow-db
          property: connectionString
    healthCheckPath: /api/health

databases:
  - name: projectflow-db
    databaseName: projectflow
    user: projectflow_user
    plan: free
